<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3B22"/>
      <stop offset="100%" stop-color="#1F2B1A"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- wallet body -->
  <rect x="120" y="176" width="272" height="188" rx="28" fill="#F4F2EA"/>
  <!-- wallet flap shadow -->
  <path d="M120 204 C120 186 134 176 152 176 L344 176 C368 176 392 194 392 220 L392 234 L120 234 Z" fill="#E7E5DC"/>

  <!-- coin / card slot -->
