name: fintrack
description: "FinTrack — a friendly personal finance manager built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation (gives us proper back / home behaviour on every screen,
  # and works the same way on mobile AND desktop/web windows)
  go_router: ^14.2.0

  # State management — simple, no boilerplate, easy to read
  provider: ^6.1.2

  # Local persistence (data survives app restarts, works on
  # Android, iOS, desktop and web)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3      # enables SQLite on Windows / Linux / macOS desktop
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
